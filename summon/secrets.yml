# Summon maps Conjur variables to environment variables for one process.
#
# Why this file exists, and why it is the *default* path in this lab:
#
# The obvious way to get a secret from Conjur into Terraform is the provider's
# `conjur_secret` data source. It works, and it writes the retrieved value into
# terraform.tfstate in plaintext. Terraform records every data source result in
# state - that is how it detects drift - and it does not special-case secrets.
#
# So the obvious approach moves the credential out of ~/.aws/credentials and
# into a different plaintext file. That is not a fix.
#
# Summon runs the command as a child process with these variables in its
# environment. The AWS provider picks up AWS_ACCESS_KEY_ID and friends the same
# way it always does. Terraform never holds them as a value it knows about, so
# there is nothing for it to write down.
#
# Usage:  summon -p summon-conjur terraform apply
#         (or `make apply`, which wraps it)

AWS_ACCESS_KEY_ID: !var aws-credentials/access-key-id
AWS_SECRET_ACCESS_KEY: !var aws-credentials/secret-access-key
AWS_REGION: !var aws-credentials/region
