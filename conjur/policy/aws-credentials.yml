---
# Loaded into the aws-credentials policy branch:
#   conjur policy load -b aws-credentials -f aws-credentials.yml
#
# Three variables, deliberately separated rather than one blob. Separation is what
# lets you grant `execute` on the access key without granting it on the session
# token, which matters the moment you introduce a second consumer.

- !variable
  id: access-key-id
  annotations:
    description: AWS access key ID for the lab runner IAM user
    rotation: manual-90d

- !variable
  id: secret-access-key
  annotations:
    description: AWS secret access key. Never logged, never in state.
    rotation: manual-90d

- !variable
  id: region
  annotations:
    description: Not a secret. Stored here so the runner has one source of truth.

# Group that owns these variables. Human operators are added here, not to the
# host identity, separating who can *rotate* from what can *read*.
- !group
  id: secret-admins
  annotations:
    description: Can update credential values

- !permit
  role: !group secret-admins
  privileges: [ read, update ]
  resources:
    - !variable access-key-id
    - !variable secret-access-key
    - !variable region
